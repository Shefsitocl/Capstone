kind = "web"
previewPath = "/"
title = "NSP-Zero · Gestión CESFAM"
description = "Panel operacional en español para equipos SOME de CESFAM que organiza agendas, confirmaciones, riesgo de inasistencia, monitoreo del tótem y métricas en un prototipo con datos ficticios."
version = "1.0.0"
id = "artifacts/nsp-zero"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23098

[services.development]
run = "pnpm --filter @workspace/nsp-zero run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nsp-zero", "run", "build" ]
serve = "static"
publicDir = "artifacts/nsp-zero/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23098"
BASE_PATH = "/"
